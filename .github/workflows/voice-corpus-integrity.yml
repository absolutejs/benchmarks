name: Voice corpus integrity

on:
  pull_request:
    paths:
      - "voice/fixtures/**"
      - "voice/scripts/verify-corpus.ts"
      - "voice/package.json"
  push:
    branches: [main]
    paths:
      - "voice/fixtures/**"
      - "voice/scripts/verify-corpus.ts"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run corpus:verify
